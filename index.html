<!doctype html>
<html lang="az" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riyaziyyat olimpiadası arxivi</title>
<meta name="description" content="Riyaziyyat olimpiadası tapşırıqları və həlləri. PDF-ləri saytda oxu və ya yüklə.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e22; --text:#eef0ff; --muted:#a3a9cf;
  --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.22);
  --a:#8b6cff; --b:#22d3ee; --c:#ff6fb1; --shadow:0 20px 50px rgba(0,0,0,.35);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#eaeeff; --text:#161b3a; --muted:#566090;
  --glass:rgba(255,255,255,.55); --glass-b:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,1);
  --shadow:0 20px 50px rgba(60,70,140,.18);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}

/* animated background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.blob.b1{width:46vmax;height:46vmax;background:var(--a);top:-14vmax;left:-10vmax}
.blob.b2{width:40vmax;height:40vmax;background:var(--b);bottom:-16vmax;right:-8vmax;animation-duration:27s;animation-delay:-6s}
.blob.b3{width:30vmax;height:30vmax;background:var(--c);top:35%;left:48%;opacity:.35;animation-duration:31s;animation-delay:-12s}
:root[data-theme="light"] .blob{opacity:.4}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18) rotate(30deg)}}
.sym{position:absolute;font-family:var(--display);color:var(--text);opacity:.08;animation:float linear infinite;user-select:none}
@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}

header.top{position:sticky;top:12px;z-index:20;margin-top:12px}
header.top .glass{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 18px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem;text-decoration:none;color:inherit}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-style:normal;font-size:1.2rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);cursor:pointer;display:grid;place-items:center;transition:transform .3s}
.icon-btn:hover{transform:rotate(25deg) scale(1.08)}

.hero{padding:clamp(48px,9vw,110px) 0 28px;text-align:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,7.2vw,5rem);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;max-width:15ch;margin-inline:auto;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.hero h1 span{background:linear-gradient(100deg,var(--a),var(--b) 50%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 8s linear infinite}
.hero p{color:var(--muted);max-width:46ch;margin:18px auto 0;font-size:1.08rem;animation:rise 1s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}
@keyframes shine{to{background-position:200% 0}}

.search{display:flex;align-items:center;gap:10px;max-width:560px;margin:30px auto 0;padding:8px 8px 8px 20px;border-radius:999px;animation:rise 1s .3s cubic-bezier(.2,.8,.2,1) both;transition:box-shadow .3s}
.search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 55%,transparent),var(--shadow)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1rem;padding:8px 0}
.search input::placeholder{color:var(--muted)}
.search kbd{font:600 .75rem var(--body);padding:3px 9px;border-radius:8px;border:1px solid var(--glass-b);color:var(--muted)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:34px 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);cursor:pointer;font-weight:600;font-size:.92rem;transition:background .25s,transform .25s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.92rem}
select{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:8px 12px;cursor:pointer}
select option{color:#111}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),hsl(var(--h) 90% 70% / .22),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-5px)}
.card:hover::before{opacity:1}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font:800 1.5rem var(--display);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 50) 85% 55%))}
.tag{font-size:.8rem;font-weight:600;padding:4px 11px;border-radius:999px;background:hsl(var(--h) 90% 65% / .16);color:hsl(var(--h) 90% 75%)}
:root[data-theme="light"] .tag{color:hsl(var(--h) 60% 35%)}
.card h3{font:700 1.08rem/1.3 var(--display);flex:1}
.year{color:var(--muted);font-size:.88rem}
.actions{display:flex;gap:8px}
.btn{flex:1;text-align:center;text-decoration:none;cursor:pointer;padding:10px 14px;border-radius:14px;font-weight:600;font-size:.94rem;border:1px solid var(--glass-b);background:var(--glass);color:inherit;transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-2px);background:var(--glass-hi)}
.btn.primary{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.more{display:block;margin:28px auto 0;padding:12px 28px;border-radius:999px;cursor:pointer;font-weight:600}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
footer{padding:50px 0 40px;text-align:center;color:var(--muted);font-size:.9rem}

/* viewer */
.modal{position:fixed;inset:0;z-index:50;display:none;padding:clamp(0px,2vw,24px);background:rgba(5,8,20,.6);backdrop-filter:blur(8px)}
.modal.open{display:block;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.panel{height:100%;max-width:980px;margin:auto;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:pop .45s cubic-bezier(.2,.9,.25,1.1) both;background:color-mix(in srgb,var(--bg) 70%,transparent)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--glass-b)}
.bar h2{flex:1;font:700 1rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{flex:none;padding:8px 14px}
.pages{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:14px;scroll-behavior:smooth}
.pages canvas{background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:100%}
.state{margin:auto;text-align:center;color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--glass-b);border-top-color:var(--b);margin:0 auto 12px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.count{font-size:.85rem;color:var(--muted);flex:none}

@media (max-width:560px){.search kbd{display:none}.bar .btn.x{display:none}.tools{flex-direction:column;align-items:stretch}.meta{justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="syms"></div></div>

<header class="top"><div class="wrap"><div class="glass">
  <a class="logo" href="#"><i>π</i>Olimpiada arxivi</a>
  <button class="icon-btn" id="theme" aria-label="Tema dəyiş">🌙</button>
</div></div></header>

<main class="wrap">
  <section class="hero">
    <h1>Riyaziyyat <span>olimpiadası</span> arxivi</h1>
    <p>Keçmiş illərin tapşırıqları və həlləri. Səhifədən çıxmadan oxu, ya da PDF-i yüklə.</p>
    <label class="search glass">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Axtar: ad, il, mövzu…" autocomplete="off" aria-label="Axtar">
      <kbd>/</kbd>
    </label>
  </section>

  <div class="tools">
    <div class="chips" id="chips"></div>
    <div class="meta"><span id="count"></span>
      <select id="sort" aria-label="Sırala">
        <option value="new">Ən yenilər</option><option value="old">Ən köhnələr</option><option value="az">Ada görə (A–Z)</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <button class="btn glass more" id="more" hidden>Daha çox göstər</button>
</main>
<footer>Riyaziyyat olimpiadası arxivi</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="panel glass">
    <div class="bar">
      <h2 id="mt"></h2><span class="count" id="pc"></span>
      <a class="btn x" id="newtab" target="_blank" rel="noopener">Yeni tabda aç</a>
      <a class="btn primary" id="dl" download>Yüklə</a>
      <button class="icon-btn" id="close" aria-label="Bağla">✕</button>
    </div>
    <div class="pages" id="pages"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const PAGE=24;
let cat="Hamısı",shown=PAGE,token=0,libP=null;
const list=(window.PDFS||[]).map((p,i)=>({...p,i}));
const cats=["Hamısı",...[...new Set(list.map(p=>p.cat||"Digər"))].sort((a,b)=>a.localeCompare(b,"az"))];
const hue=c=>[...c].reduce((h,ch)=>h*31+ch.charCodeAt(0),7)%360;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const url=f=>encodeURI(f);

/* background symbols */
const glyphs=["∑","π","∞","√","∫","≠","θ","Δ","%","÷","×","∈"];
$("#syms").innerHTML=Array.from({length:14},(_,i)=>`<span class="sym" style="left:${(i*7.3+4)%96}%;font-size:${28+(i*13)%48}px;animation-duration:${34+(i*7)%30}s;animation-delay:-${(i*5)%40}s">${glyphs[i%glyphs.length]}</span>`).join("");

/* theme */
const root=document.documentElement,tb=$("#theme");
const setTheme=t=>{root.dataset.theme=t;tb.textContent=t==="dark"?"🌙":"☀️";try{localStorage.setItem("theme",t)}catch(e){}};
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
tb.onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");

/* chips */
$("#chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));shown=PAGE;render()};
$("#q").oninput=()=>{shown=PAGE;render()};
$("#sort").onchange=()=>{shown=PAGE;render()};
$("#more").onclick=()=>{shown+=PAGE;render()};

function filtered(){
  const q=$("#q").value.trim().toLowerCase(),s=$("#sort").value;
  let r=list.filter(p=>(cat==="Hamısı"||(p.cat||"Digər")===cat)&&(!q||`${p.name} ${p.cat||""} ${p.year||""}`.toLowerCase().includes(q)));
  r.sort((a,b)=>s==="az"?a.name.localeCompare(b.name,"az"):s==="old"?(a.year||0)-(b.year||0):(b.year||0)-(a.year||0)||a.name.localeCompare(b.name,"az"));
  return r;
}
function render(){
  const r=filtered();
  $("#count").textContent=`${r.length} fayl`;
  $("#grid").innerHTML=r.length?r.slice(0,shown).map(p=>{
    const c=p.cat||"Digər",base=p.file.split("/").pop();
    return `<article class="card glass" style="--h:${hue(c)}"><div class="top"><div class="ic">∑</div><span class="tag">${esc(c)}</span></div>
    <h3>${esc(p.name)}</h3><div class="year">${p.year?esc(p.year)+" il":"&nbsp;"}</div>
    <div class="actions"><button class="btn primary" data-v="${p.i}">Bax</button><a class="btn" href="${url(p.file)}" download="${esc(base)}">Yüklə</a></div></article>`}).join("")
    :`<div class="empty" style="grid-column:1/-1">Heç nə tapılmadı. Başqa söz yoxla və ya filtri sıfırla.</div>`;
  $("#more").hidden=r.length<=shown;
}
$("#grid").addEventListener("mousemove",e=>{const c=e.target.closest(".card");if(!c)return;const b=c.getBoundingClientRect();
  c.style.setProperty("--mx",e.clientX-b.left+"px");c.style.setProperty("--my",e.clientY-b.top+"px")});
$("#grid").onclick=e=>{const b=e.target.closest("[data-v]");if(b)openPdf(list[+b.dataset.v])};

/* viewer (PDF.js loads only when first opened) */
function loadLib(){
  return libP||(libP=new Promise((ok,no)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok()};
    s.onerror=no;document.head.appendChild(s)}));
}
async function openPdf(p){
  const my=++token,box=$("#pages");
  $("#mt").textContent=p.name;$("#pc").textContent="";
  $("#dl").href=$("#newtab").href=url(p.file);$("#dl").setAttribute("download",p.file.split("/").pop());
  $("#modal").classList.add("open");document.body.style.overflow="hidden";
  box.scrollTop=0;box.innerHTML=`<div class="state"><div class="spin"></div>Yüklənir…</div>`;
  try{
    await loadLib();
    const doc=await pdfjsLib.getDocument(url(p.file)).promise;
    if(my!==token)return;
    box.innerHTML="";
    for(let n=1;n<=doc.numPages;n++){
      const pg=await doc.getPage(n);if(my!==token)return;
      const w=Math.min(box.clientWidth-24,900),dpr=Math.min(devicePixelRatio||1,2);
      const vp=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*dpr});
      const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;cv.style.width=w+"px";
      box.appendChild(cv);
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      $("#pc").textContent=`${n} / ${doc.numPages}`;
    }
  }catch(err){
    if(my===token)box.innerHTML=`<div class="state">Fayl açılmadı. Yolun düzgün olduğunu yoxla (${esc(p.file)}).<br><br><a class="btn primary" href="${url(p.file)}" target="_blank" rel="noopener">Yeni tabda aç</a></div>`;
  }
}
function closePdf(){token++;$("#modal").classList.remove("open");document.body.style.overflow="";$("#pages").innerHTML=""}
$("#close").onclick=closePdf;
$("#modal").onclick=e=>{if(e.target.id==="modal")closePdf()};
addEventListener("keydown",e=>{
  if(e.key==="Escape")closePdf();
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}
});
render();
</script>
</body>
</html>
